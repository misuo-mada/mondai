<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>特設クイズ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    #titleScreen, #quizScreen, #finalResult {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 20px;
    }

    #titleScreen {
      display: flex;
      background: linear-gradient(to bottom, #fefefe, #ccc);
    }

    #titleScreen h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    #introContainer {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    #introSpeech {
      background: #fff;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 1px 1px 6px rgba(0,0,0,0.2);
      font-size: 16px;
      max-width: 300px;
      text-align: left;
      margin-right: 12px;
    }

#faceImage {
  width: auto;
  height: 120px; /* 高さだけ指定。必要なら調整 */
  border: none;
  border-radius: 0; /* ← これで丸めを解除 */
  background: none;
}


    #startBtn {
      font-size: 20px;
      padding: 12px 24px;
      background-color: #4285f4;
      color: white;
      border: none;
      border-radius: 8px;
    }

    #quizScreen {
      display: none;
    }

    #timer {
      position: fixed;
      top: 10px;
      right: 10px;
      font-size: 16px;
      background: #333;
      color: white;
      padding: 6px 12px;
      border-radius: 8px;
    }

    #questionArea {
      display: flex;
      align-items: center;
      margin-top: 60px;
    }

    #speechBubble {
      background: white;
      border-radius: 12px;
      padding: 15px;
      margin-right: 12px;
      max-width: 60vw;
      text-align: left;
      box-shadow: 1px 1px 6px rgba(0,0,0,0.2);
      font-size: 16px;
    }

    #choices {
      margin-top: 30px;
    }

.choice {
  font-size: 24px;
  padding: 10px 30px;
  margin: 10px;
  border-radius: 8px;
  border: none;
  background-color: #f0f0f0;
  box-shadow: 1px 1px 4px rgba(0,0,0,0.2);
  transition: transform 0.1s ease, box-shadow 0.1s ease;
}

.choice:active {
  transform: scale(0.95);
  box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.2);
}

#startBtn {
  font-size: 20px;
  padding: 12px 24px;
  background-color: #4285f4;
  color: white;
  border: none;
  border-radius: 8px;
  transition: transform 0.1s ease, box-shadow 0.1s ease;
}

#startBtn:active {
  transform: scale(0.95);
  box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.3);
}


    #result, #explanation {
      margin-top: 20px;
      font-size: 16px;
    }

    #nextBtn {
      margin-top: 20px;
      font-size: 16px;
      padding: 10px 20px;
      border-radius: 6px;
      border: none;
      background-color: #4caf50;
      color: white;
      display: none;
    }

    #finalResult {
      font-size: 20px;
      padding: 20px;
    }

/* 共通：クリック感あるアニメーション */
button {
  transition: transform 0.1s ease, box-shadow 0.1s ease;
}

button:active {
  transform: scale(0.95);
  box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.3);
}

/* クイズスタートボタン */
#startBtn {
  font-size: 20px;
  padding: 12px 24px;
  background-color: #4285f4;
  color: white;
  border: none;
  border-radius: 8px;
  box-shadow: 1px 1px 4px rgba(0,0,0,0.2);
}

/* 次へボタン */
#nextBtn {
  margin-top: 20px;
  font-size: 16px;
  padding: 10px 20px;
  border-radius: 6px;
  border: none;
  background-color: #4caf50;
  color: white;
  display: none;
  box-shadow: 1px 1px 4px rgba(0,0,0,0.2);
}

/* 共通：おしゃれなフラットボタンの基本スタイル */
button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  border-radius: 12px;
  padding: 12px 24px;
  font-size: 18px;
  transition: all 0.2s ease;
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  background: linear-gradient(145deg, #ffffff, #e6e6e6);
  color: #333;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 12px rgba(0,0,0,0.15);
}

button:active {
  transform: scale(0.96);
  box-shadow: inset 2px 2px 6px rgba(0,0,0,0.2);
}

/* クイズスタートボタン（青系） */
#startBtn {
  background: linear-gradient(145deg, #4a90e2, #357bd8);
  color: #fff;
}

/* 次へボタン（緑系） */
#nextBtn {
  background: linear-gradient(145deg, #43a047, #388e3c);
  color: #fff;
  display: none;
}

/* 〇×ボタン（明るめグレー） */
.choice {
  background: linear-gradient(145deg, #fafafa, #dddddd);
  color: #333;
  font-size: 22px;
  padding: 10px 30px;
  margin: 10px;
}


    @media (max-width: 480px) {
      #speechBubble {
        font-size: 14px;
        max-width: 70vw;
      }

      .choice {
        font-size: 20px;
        padding: 8px 20px;
      }

      #result, #explanation {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

<!-- BGM・効果音 -->
<audio id="bgm" src="bgm.mp3" loop></audio>
<audio id="correctSound" src="correct.mp3"></audio>
<audio id="wrongSound" src="wrong.mp3"></audio>
<audio id="timeoutSound" src="timeout.mp3"></audio>

<!-- タイトル画面 -->
<div id="titleScreen">
  <div>
    <h1>第４分科会：特設クイズ！</h1>
    <div id="introContainer">
      <div id="introSpeech">
        ようこそ！このクイズは〇か×で答える3問形式です。<br>
        時間内に答えられるかな？頑張ってくださいね！
      </div>
<img id="faceImage" src="hakase.png" alt="博士">

    </div>
    <button id="startBtn" onclick="startQuiz()">クイズスタート</button>
  </div>
</div>

<!-- クイズ画面 -->
<div id="quizScreen">
  <div id="timer">制限時間: <span id="time">10</span>秒</div>

  <div id="questionArea">
    <div id="speechBubble">問題文がここに表示されます</div>
    <img id="faceImage" src="hakase.png" alt="顔">
  </div>

  <div id="choices">
    <button class="choice" onclick="answer(true)">〇</button>
    <button class="choice" onclick="answer(false)">×</button>
  </div>

  <div id="result"></div>
  <div id="explanation"></div>
  <button id="nextBtn" onclick="nextQuestion()">次へ</button>
</div>

<!-- 結果画面 -->
<div id="finalResult"></div>

<script>
const questions = [
  {
    text: "愛知事務研が提案している共同学校事務室モデルプランは、副担当校制、メンター制、業務担当制、共同学校事務室の連携体制の再考、AI及びICTの活用の５つである。",
    answer: false,
    explanation: "提案しているモデルプランは、副担当校制、メンター制、業務担当制、共同学校事務室の連携体制の再考の４つです！「AI及びICTの活用」については、今回、提案しているモデルプランに含めていません。しかし、文部科学省が2024年12月に「初等中等教育段階における生成AIの利活用に関するガイドライン（Ver.2.0）」を公表し、授業と校務それぞれの活用例や留意点を具体的に示しています。今後、共同学校事務室においても、文書作成支援やデータの整理・活用の観点から、AI及びICT環境の整備等は必要不可欠になってくると予想されます。"
  },
  {
    text: "今回の実践において使用したWEB会議システムはMicrosoft Teamsである？",
    answer: true,
    explanation: "今回の実践については、Microsoft Teamsを使用しています。チャットと添付ファイルをはじめとして、複雑な操作を画面共有したり、意見の取りまとめを共同編集したり、見学希望の事務職員をゲストとして朝礼に参加できるようにしたりするなど、Teamsの様々な機能を使っています。"
  },
  {
    text: "今回の大会テーマは「学校・家庭・地域、次代へつなぐ学校事務の創生」である？",
    answer: false,
    explanation: "正しくは、「学校・家庭・地域、次代へつなげる学校事務の創造」です。平成28年には、「学校・家庭・地域、次代へつなぐ学校事務の創生」を大会テーマとしましたが、令和５年に「学校・家庭・地域、次代へつなげる学校事務の創造」が新大会テーマとして設定され、本大会が新大会テーマにおける最初の大会となります。新大会テーマの趣旨としては、これまでに生み出したものを、より具体的に形成していき、実体を造ることを推進していきたいという思いから、「創生」を「創造」に変更しています。「学校・家庭・地域」と子どもたちにかかわる様々なものを適切に、「つなげる」意思をもち、今ある学校事務をさらに深化させ、すぐ先の未来や世代を含めた「次代へつなげる」ことを目指しています。"
  }
];

let current = 0;
let score = 0;
let timer;
let timeLeft = 10;
let totalStartTime = 0;
let totalEndTime = 0;

function startQuiz() {
  document.getElementById("titleScreen").style.display = "none";
  document.getElementById("quizScreen").style.display = "flex";
  totalStartTime = Date.now();
  document.getElementById("bgm").play();
  showQuestion();
}

function showQuestion() {
  document.getElementById("speechBubble").innerText = questions[current].text;
  document.getElementById("result").innerText = "";
  document.getElementById("explanation").innerText = "";
  document.getElementById("nextBtn").style.display = "none";
  document.querySelectorAll(".choice").forEach(btn => btn.disabled = false);
  startTimer();
}

function startTimer() {
  timeLeft = 10;
  document.getElementById("time").innerText = timeLeft;
  clearInterval(timer);
  timer = setInterval(() => {
    timeLeft--;
    document.getElementById("time").innerText = timeLeft;
    if (timeLeft <= 0) {
      clearInterval(timer);
      answer(null);
    }
  }, 1000);
}

function answer(userAnswer) {
  clearInterval(timer);
  document.querySelectorAll(".choice").forEach(btn => btn.disabled = true);
  const correct = questions[current].answer;

  if (userAnswer === correct) {
    document.getElementById("result").innerText = "正解！";
    document.getElementById("correctSound").play();
    score++;
  } else if (userAnswer === null) {
    document.getElementById("result").innerText = "時間切れ！";
    document.getElementById("timeoutSound").play();
  } else {
    document.getElementById("result").innerText = "不正解！";
    document.getElementById("wrongSound").play();
  }

  document.getElementById("explanation").innerText = questions[current].explanation;
  document.getElementById("nextBtn").style.display = "inline-block";
}

function nextQuestion() {
  current++;
  if (current < questions.length) {
    showQuestion();
  } else {
    showFinalResult();
  }
}

function showFinalResult() {
  totalEndTime = Date.now();
  const totalSeconds = Math.round((totalEndTime - totalStartTime) / 1000);
  document.getElementById("quizScreen").style.display = "none";
  document.getElementById("finalResult").style.display = "flex";
  document.getElementById("finalResult").innerHTML = `
    <p>クイズ終了！<br>
    正解数: <strong>${score} / ${questions.length}</strong><br>
    所要時間: <strong>${totalSeconds} 秒</strong></p>`;
}
</script>

</body>
</html>
